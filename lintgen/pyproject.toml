[project]
name = "lintgen"
version = "0.1.0"
description = "LintGen: RAG-augmented Android Lint detector generation"
readme = "README.md"
authors = [
    { name = "fakorede", email = "abiolafakorede@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Core
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    # RAG
    "faiss-cpu>=1.7",
    "sentence-transformers>=3.0",
    "langchain-community>=0.2",
    # Inference providers
    "openai>=1.0",
    "anthropic>=0.20",
    "google-generativeai>=0.5",
]

[project.optional-dependencies]
gpu = []  # install faiss-gpu manually on HPC nodes
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
lintgen = "lintgen.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
